[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "recomputation-free-kv-reuse"
version = "0.1.0"
description = "ATTUNER: Recomputation-Free Agentic Context KV Reuse"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = {file = "LICENSE"}
dependencies = [
  "torch==2.8.0", "transformers==4.57.1", "numpy>=1.26,<3",
  "pyyaml>=6", "psutil>=5", "huggingface-hub>=0.34,<1",
  "gdown>=5", "tqdm>=4.67", "ftfy>=6", "regex", "jsonnet>=0.20",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src", "."]
include = ["attuner", "attuner.*", "baselines", "baselines.*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
